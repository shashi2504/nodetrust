<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .zone { fill: #f7f7f7; stroke: #999; stroke-width: 1; }
      .zt { font-weight: bold; font-size: 13px; fill: #333; }
      .box { fill: #fff; stroke: #333; stroke-width: 1.2; }
      .key { fill: #eef4fb; stroke: #2d5d8a; stroke-width: 1.4; }
      .ext { fill: #fdf3e6; stroke: #a46a1f; stroke-width: 1.2; }
      .plan { fill: #fff; stroke: #888; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .t { font-weight: bold; fill: #111; }
      .s { fill: #444; font-size: 11px; }
      .f { fill: #2d5d8a; font-size: 11px; font-family: Menlo, Consolas, monospace; }
      .ln { stroke: #333; stroke-width: 1.3; fill: none; marker-end: url(#a); }
      .dl { stroke: #888; stroke-width: 1.3; fill: none; marker-end: url(#a); stroke-dasharray: 5 4; }
      .lb { fill: #333; font-size: 11px; }
    </style>
  </defs>

  <text x="20" y="28" font-size="18" font-weight="bold">nodetrust: how the parts fit together</text>
  <text x="20" y="47" class="s">Blue: Go packages that make the trust decision. Orange: AWS services. Dashed: Phase 5 (planned). Paths are folders in this repository.</text>

  <!-- Build time -->
  <rect class="zone" x="20" y="62" width="1060" height="118" rx="6"/>
  <text class="zt" x="32" y="82">1. Build time (once per AMI)</text>
  <rect class="box" x="40" y="94" width="230" height="74" rx="4"/>
  <text class="t" x="52" y="114">Golden AMI build</text>
  <text class="f" x="52" y="130">infra/phase1/ami</text>
  <text class="s" x="52" y="146">Ubuntu + kubeadm + agent, Secure Boot,</text>
  <text class="s" x="52" y="160">IMA policy, modules locked</text>
  <rect class="box" x="320" y="94" width="270" height="74" rx="4"/>
  <text class="t" x="332" y="114">Reference manifest</text>
  <text class="f" x="332" y="130">infra/phase2, pkg/manifest</text>
  <text class="s" x="332" y="146">SHA-256 of every file in the AMI,</text>
  <text class="s" x="332" y="160">signed with KMS, logged in Rekor</text>
  <rect class="ext" x="640" y="94" width="200" height="74" rx="4"/>
  <text class="t" x="652" y="114">S3 bucket + KMS key</text>
  <text class="f" x="652" y="130">infra/trust</text>
  <text class="s" x="652" y="146">signed manifests,</text>
  <text class="s" x="652" y="160">pinned public keys</text>
  <rect class="ext" x="880" y="94" width="180" height="74" rx="4"/>
  <text class="t" x="892" y="114">Rekor (sigstore)</text>
  <text class="s" x="892" y="134">public transparency log</text>
  <text class="s" x="892" y="148">of each manifest signature</text>
  <path class="ln" d="M270,131 L318,131"/>
  <path class="ln" d="M590,131 L638,131"/>
  <path class="ln" d="M590,108 C 700,70 820,70 878,104"/>

  <!-- Worker -->
  <rect class="zone" x="20" y="200" width="330" height="390" rx="6"/>
  <text class="zt" x="32" y="220">2. Worker node (EC2 with NitroTPM)</text>
  <text class="s" x="32" y="236">launched by the Auto Scaling group, infra/cluster</text>
  <rect class="ext" x="40" y="250" width="290" height="60" rx="4"/>
  <text class="t" x="52" y="270">NitroTPM + Linux IMA</text>
  <text class="s" x="52" y="286">PCRs 0-9: boot (firmware, shim, kernel)</text>
  <text class="s" x="52" y="300">PCR 10: every file the kernel runs or reads</text>
  <rect class="key" x="40" y="330" width="290" height="140" rx="4"/>
  <text class="t" x="52" y="350">Attestation agent</text>
  <text class="f" x="52" y="366">cmd/agent, pkg/agent</text>
  <text class="s" x="52" y="384">EK and AK, credential activation</text>
  <text class="s" x="52" y="398">quote over PCRs 0-10 (nonce bound to TLS)</text>
  <text class="s" x="52" y="412">sends the boot log and new IMA entries</text>
  <text class="s" x="52" y="426">canary file, forced-read sweep,</text>
  <text class="s" x="52" y="440">mount audit, hint long-poll</text>
  <text class="s" x="52" y="456">listens on :9443 (mTLS, verifier only)</text>
  <path class="ln" d="M185,312 L185,328"/>
  <rect class="box" x="40" y="490" width="290" height="82" rx="4"/>
  <text class="t" x="52" y="510">kubelet, containerd, Calico</text>
  <text class="s" x="52" y="526">joins with kubeadm; tainted</text>
  <text class="s" x="52" y="540">trust.k8s-attest.io/unattested</text>
  <text class="s" x="52" y="556">until the node is verified</text>

  <!-- Verifier -->
  <rect class="zone" x="380" y="200" width="430" height="540" rx="6"/>
  <text class="zt" x="392" y="220">3. Verifier host (outside the cluster)</text>
  <text class="f" x="392" y="236">cmd/verifier serve (set up by infra/phase4)</text>
  <rect class="key" x="400" y="250" width="390" height="62" rx="4"/>
  <text class="t" x="412" y="270">Scheduler and enrollment</text>
  <text class="f" x="412" y="286">pkg/verifier (daemon.go, enroll.go, client.go)</text>
  <text class="s" x="412" y="302">finds workers, enrolls them, challenges each one every 5-60 s</text>
  <rect class="key" x="400" y="326" width="185" height="96" rx="4"/>
  <text class="t" x="412" y="346">Quote check</text>
  <text class="f" x="412" y="362">pkg/attest</text>
  <text class="s" x="412" y="378">AK signature, nonce,</text>
  <text class="s" x="412" y="392">PCR digest, reset count</text>
  <text class="f" x="412" y="410">pkg/protocol</text>
  <rect class="key" x="605" y="326" width="185" height="96" rx="4"/>
  <text class="t" x="617" y="346">Boot check</text>
  <text class="f" x="617" y="362">pkg/eventlog</text>
  <text class="f" x="617" y="376">pkg/bootpolicy</text>
  <text class="s" x="617" y="392">log replays to PCRs 0-9,</text>
  <text class="s" x="617" y="406">expected boot chain</text>
  <rect class="key" x="400" y="436" width="390" height="80" rx="4"/>
  <text class="t" x="412" y="456">Runtime file check</text>
  <text class="f" x="412" y="472">pkg/ima, pkg/imapolicy, pkg/joinref, pkg/trust</text>
  <text class="s" x="412" y="488">IMA log replays to PCR 10; each file: match, changed, runtime,</text>
  <text class="s" x="412" y="502">join-time, mismatch or unknown; canary, sweep, mounts</text>
  <rect class="key" x="400" y="530" width="390" height="80" rx="4"/>
  <text class="t" x="412" y="550">Trust engine</text>
  <text class="f" x="412" y="566">pkg/trust, pkg/verifier/judge.go, track.go</text>
  <text class="s" x="412" y="582">critical findings; score = sum of w * max(0, 1 - m/t);</text>
  <text class="s" x="412" y="596">tier, hysteresis, drift (sudden, isolated, gradual)</text>
  <rect class="key" x="400" y="624" width="390" height="62" rx="4"/>
  <text class="t" x="412" y="644">Signed NodeTrust</text>
  <text class="f" x="412" y="660">pkg/nodetrust</text>
  <text class="s" x="412" y="676">ECDSA P-256 signature, seq, server-side apply</text>
  <rect class="box" x="400" y="698" width="390" height="30" rx="4"/>
  <text class="f" x="412" y="718">pkg/provider/aws: EC2 and S3 over plain HTTPS (SigV4)</text>
  <path class="ln" d="M595,312 L595,324"/>
  <path class="ln" d="M595,422 L595,434"/>
  <path class="ln" d="M595,516 L595,528"/>
  <path class="ln" d="M595,610 L595,622"/>

  <!-- Agent <-> verifier -->
  <path class="ln" d="M332,370 L398,282"/>
  <path class="ln" d="M398,372 L334,400"/>
    <text class="lb" x="336" y="342">challenge</text>
  <text class="lb" x="336" y="418">quote + logs</text>

  <!-- AWS APIs -->
  <rect class="ext" x="840" y="250" width="240" height="88" rx="4"/>
  <text class="t" x="852" y="270">EC2 API</text>
  <text class="s" x="852" y="288">GetInstanceTpmEkPub: the TPM's</text>
  <text class="s" x="852" y="302">real EK, from the cloud</text>
  <text class="s" x="852" y="318">DescribeInstances: AMI, zone, IP</text>
  <path class="ln" d="M792,290 L838,290"/>
  <path class="ln" d="M750,170 L750,248"/>
  <text class="lb" x="756" y="226">signed manifest</text>

  <!-- Control plane -->
  <rect class="zone" x="840" y="360" width="240" height="380" rx="6"/>
  <text class="zt" x="852" y="380">4. Control plane</text>
  <rect class="box" x="856" y="394" width="208" height="128" rx="4"/>
  <text class="t" x="868" y="414">API server</text>
  <text class="s" x="868" y="432">NodeTrust objects, one per</text>
  <text class="s" x="868" y="446">worker (CRD); only the</text>
  <text class="s" x="868" y="460">verifier may write them</text>
  <text class="s" x="868" y="474">(admission policy)</text>
  <text class="f" x="868" y="494">infra/phase4/k8s/</text>
  <text class="f" x="868" y="508">nodetrust.yaml</text>
  <path class="ln" d="M792,655 L822,655 L822,480 L854,480"/>
  <text class="lb" x="818" y="640" transform="rotate(-90 818 640)">signed state</text>
  <rect class="plan" x="856" y="560" width="208" height="110" rx="4"/>
  <text class="t" x="868" y="580">Trust controller</text>
  <text class="f" x="868" y="596">cmd/controller (Phase 5)</text>
  <text class="s" x="868" y="614">checks the signature, then</text>
  <text class="s" x="868" y="628">taints, isolates, snapshots</text>
  <text class="s" x="868" y="642">and replaces bad nodes</text>
  <text class="f" x="868" y="658">pkg/provider</text>
  <path class="dl" d="M960,524 L960,558"/>
  <text class="s" x="852" y="700">nodetrust-check: checks the</text>
  <text class="s" x="852" y="714">signatures from kubectl output</text>
</svg>
