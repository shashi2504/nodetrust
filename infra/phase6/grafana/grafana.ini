# Grafana on the verifier host (Phase 6): local only, reached through an SSM
# port forward. Anonymous users can view; the admin password is set at
# install and kept in /etc/nodetrust/grafana-admin-password (root only).
# The data source and dashboard provider are in /etc/grafana/provisioning.
[server]
http_addr = 127.0.0.1
http_port = 3000

[auth.anonymous]
enabled = true
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false
